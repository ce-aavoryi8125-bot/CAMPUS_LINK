# Nginx Reverse Proxy Configuration for CampusLink 2.0
upstream campuslink_app {
    server web:5000;
    keepalive 32;
}

server {
    listen 80;
    server_name localhost _;

    # Client payload constraints
    client_max_body_size 10M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/json application/xml;
    gzip_disable "MSIE [1-6]\.";

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Direct Static Asset Serving with Browser Caching
    location /static/ {
        alias /app/static/;
        expires 1d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    location /assets/ {
        alias /app/assets/;
        expires 1d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Proxy to Gunicorn Web Application
    location / {
        proxy_pass http://campuslink_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        
        # Forward Client Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        
        # Buffer Tuning
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 8 8k;
    }
}
