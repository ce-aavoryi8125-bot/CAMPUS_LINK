version: '3.8'

# Development Compose Configuration for CampusLink 2.0
# Supports hot code reloading and live development against local MySQL and Redis
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: campuslink_web_dev
    ports:
      - "5000:5000"
    volumes:
      - .:/app
    environment:
      - CAMPUSLINK_ENV=development
      - PORT=5000
      - USE_MYSQL=true
      - MYSQL_HOST=db
      - MYSQL_PORT=3306
      - MYSQL_USER=campus_dev_user
      - MYSQL_PASSWORD=campus_dev_pass
      - MYSQL_DB=campuslink_umat
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - CELERY_ALWAYS_EAGER=true
      - CAMPUSLINK_SECRET_KEY=campuslink_umat_secret_key_2026
      - CAMPUSLINK_JWT_SECRET=campuslink_umat_jwt_super_secret_key_2026_ghana
    command: python app.py
    depends_on:
      - db
      - redis

  redis:
    image: redis:7.2-alpine
    container_name: campuslink_redis_dev
    ports:
      - "6379:6379"

  db:
    image: mysql:8.0
    container_name: campuslink_mysql_dev
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: dev_root_password
      MYSQL_DATABASE: campuslink_umat
      MYSQL_USER: campus_dev_user
      MYSQL_PASSWORD: campus_dev_pass
    volumes:
      - mysql_dev_data:/var/lib/mysql
      - ./database/mysql_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro

volumes:
  mysql_dev_data:
