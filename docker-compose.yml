version: '3.8'

services:
  nginx:
    image: nginx:1.25-alpine
    container_name: campuslink_nginx
    restart: unless-stopped
    ports:
      - "${PORT:-80}:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./static:/app/static:ro
      - ./assets:/app/assets:ro
    depends_on:
      web:
        condition: service_healthy
    networks:
      - frontend_net

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: campuslink_web
    restart: unless-stopped
    environment:
      - CAMPUSLINK_ENV=production
      - PORT=5000
      - USE_MYSQL=true
      - MYSQL_HOST=db
      - MYSQL_PORT=3306
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DB=${MYSQL_DB:-campuslink_umat}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/1
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@redis:6379/2
      - CELERY_ALWAYS_EAGER=false
      - CAMPUSLINK_SECRET_KEY=${CAMPUSLINK_SECRET_KEY}
      - CAMPUSLINK_JWT_SECRET=${CAMPUSLINK_JWT_SECRET}
      - MOMO_WEBHOOK_SECRET=${MOMO_WEBHOOK_SECRET}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/healthz')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - frontend_net
      - backend_net

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: campuslink_worker
    restart: unless-stopped
    command: celery -A core.celery_app.celery_app worker --loglevel=info --concurrency=4 -n worker1@%h
    environment:
      - CAMPUSLINK_ENV=production
      - USE_MYSQL=true
      - MYSQL_HOST=db
      - MYSQL_PORT=3306
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DB=${MYSQL_DB:-campuslink_umat}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/1
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@redis:6379/2
      - CELERY_ALWAYS_EAGER=false
      - CAMPUSLINK_SECRET_KEY=${CAMPUSLINK_SECRET_KEY}
      - CAMPUSLINK_JWT_SECRET=${CAMPUSLINK_JWT_SECRET}
      - MOMO_WEBHOOK_SECRET=${MOMO_WEBHOOK_SECRET}
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    networks:
      - backend_net

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: campuslink_scheduler
    restart: unless-stopped
    command: celery -A core.celery_app.celery_app beat --loglevel=info
    environment:
      - CAMPUSLINK_ENV=production
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/1
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@redis:6379/2
      - CELERY_ALWAYS_EAGER=false
      - CAMPUSLINK_SECRET_KEY=${CAMPUSLINK_SECRET_KEY}
      - CAMPUSLINK_JWT_SECRET=${CAMPUSLINK_JWT_SECRET}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - backend_net

  redis:
    image: redis:7.2-alpine
    container_name: campuslink_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep PONG || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - backend_net

  db:
    image: mysql:8.0
    container_name: campuslink_mysql
    restart: unless-stopped
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --explicit_defaults_for_timestamp=1
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DB:-campuslink_umat}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/mysql_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - backend_net

volumes:
  mysql_data:
  redis_data:

networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge
